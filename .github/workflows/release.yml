name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Calculate and write version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          CURRENT=$(python3 - <<'PY'
          import re
          text = open("Cargo.toml", encoding="utf-8").read()
          m = re.search(r'(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("package version not found")
          print(m.group(1))
          PY
          )

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Invalid bump: $BUMP"
              exit 1
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          PREVIOUS=$(git tag --sort=-version:refname | head -1 || true)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          python3 - "$VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          path = "Cargo.toml"
          text = open(path, encoding="utf-8").read()

          out, n = re.subn(
              r'(?ms)(^\[package\].*?^version\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              text,
              count=1,
          )

          if n != 1:
              raise SystemExit("failed to update Cargo.toml")

          open(path, "w", encoding="utf-8").write(out)
          PY

          cargo check

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "## $TAG - $DATE"
            echo
            echo "### Changes"
            echo

            git log "$RANGE" \
              --pretty=format:'- %s (`%h`)' \
              --no-merges

            echo
            echo
          } > /tmp/release-notes.md

          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> /tmp/release-notes.md
          fi

          mv /tmp/release-notes.md CHANGELOG.md

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

  # ------------------------------------------------------------
  # Windows: portable EXE, no installer
  # ------------------------------------------------------------
  build-windows:
    name: Build Windows portable
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare portable package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "target\x86_64-pc-windows-msvc\release\url-scheme-handler.exe" `
            "dist\url-scheme-handler.exe"

          Copy-Item "README.md" "dist\README.md"

          Compress-Archive `
            -Path "dist\url-scheme-handler.exe", "dist\README.md" `
            -DestinationPath "url-scheme-handler-${env:VERSION}-windows-x86_64-portable.zip"

          Copy-Item `
            "target\x86_64-pc-windows-msvc\release\url-scheme-handler.exe" `
            "url-scheme-handler-${env:VERSION}-windows-x86_64.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            url-scheme-handler-${{ needs.prepare.outputs.version }}-windows-x86_64.exe
            url-scheme-handler-${{ needs.prepare.outputs.version }}-windows-x86_64-portable.zip

  # ------------------------------------------------------------
  # Linux: Debian package
  # ------------------------------------------------------------
  build-linux:
    name: Build Linux DEB
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare cargo-deb
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-gnu/release/url-scheme-handler \
             target/release/url-scheme-handler

      - name: Build Debian package
        run: |
          cargo deb \
            --no-build \
            --output "url-scheme-handler_${{ needs.prepare.outputs.version }}_amd64.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            url-scheme-handler_${{ needs.prepare.outputs.version }}_amd64.deb

  # ------------------------------------------------------------
  # macOS Intel: unsigned DMG
  # ------------------------------------------------------------
  build-macos-x86:
    name: Build macOS Intel DMG
    needs: prepare
    runs-on: macos-13

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build app
        env:
          TARGET: x86_64-apple-darwin
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./packaging/macos/build-app.sh

      - name: Create DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root

          cp -R "URL Scheme Handler.app" dmg-root/
          ln -s /Applications dmg-root/Applications

          hdiutil create \
            -volname "URL Scheme Handler" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "url-scheme-handler-${VERSION}-macos-x86_64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            url-scheme-handler-${{ needs.prepare.outputs.version }}-macos-x86_64.dmg

  # ------------------------------------------------------------
  # macOS Apple Silicon: unsigned DMG
  # ------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS ARM64 DMG
    needs: prepare
    runs-on: macos-14

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build app
        env:
          TARGET: aarch64-apple-darwin
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./packaging/macos/build-app.sh

      - name: Create DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root

          cp -R "URL Scheme Handler.app" dmg-root/
          ln -s /Applications dmg-root/Applications

          hdiutil create \
            -volname "URL Scheme Handler" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "url-scheme-handler-${VERSION}-macos-arm64.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            url-scheme-handler-${{ needs.prepare.outputs.version }}-macos-arm64.dmg

  # ------------------------------------------------------------
  # GitHub Release
  # ------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs:
      - prepare
      - build-windows
      - build-linux
      - build-macos-x86
      - build-macos-arm64

    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -type f -maxdepth 2 -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            release-assets/* \
            --title "URL Scheme Handler $TAG" \
            --notes-file CHANGELOG.md \
            --verify-tag
