name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------
  # Prepare: bump version, commit, create and push tag
  # ------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Calculate and write version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          CURRENT=$(python3 - <<'PY'
          import re
          text = open("Cargo.toml", encoding="utf-8").read()
          m = re.search(r'(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("package version not found")
          print(m.group(1))
          PY
          )

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
            *)
              echo "Invalid bump: $BUMP"
              exit 1 ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          python3 - "$VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          path = "Cargo.toml"
          text = open(path, encoding="utf-8").read()
          out, n = re.subn(
              r'(?ms)(^\[package\].*?^version\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("failed to update Cargo.toml")
          open(path, "w", encoding="utf-8").write(out)
          PY

          cargo check

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$VERSION"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

  # ------------------------------------------------------------
  # Windows: portable EXE, no installer
  # ------------------------------------------------------------
  build-windows:
    name: Build Windows portable
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare portable package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\scheme-handler.exe" "dist\scheme-handler.exe"
          Copy-Item "README.md" "dist\README.md"
          Compress-Archive -Path "dist\scheme-handler.exe", "dist\README.md" -DestinationPath "scheme-handler-${env:VERSION}-windows-x86_64-portable.zip"
          Copy-Item "target\x86_64-pc-windows-msvc\release\scheme-handler.exe" "scheme-handler-${env:VERSION}-windows-x86_64.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            scheme-handler-${{ needs.prepare.outputs.version }}-windows-x86_64.exe
            scheme-handler-${{ needs.prepare.outputs.version }}-windows-x86_64-portable.zip

  # ------------------------------------------------------------
  # Linux x86_64: DEB + AppImage
  # ------------------------------------------------------------
  build-linux-x86_64:
    name: Build Linux x86_64 DEB + AppImage
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build Debian package
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-gnu/release/scheme-handler target/release/scheme-handler
          cargo deb --no-build --output "scheme-handler_${{ needs.prepare.outputs.version }}_amd64.deb"

      - name: Prepare AppDir
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp target/x86_64-unknown-linux-gnu/release/scheme-handler \
             AppDir/usr/bin/scheme-handler
          chmod +x AppDir/usr/bin/scheme-handler

          cp packaging/linux/scheme-handler.desktop \
             AppDir/usr/share/applications/scheme-handler.desktop

          cp packaging/icon.png \
             AppDir/usr/share/icons/hicolor/512x512/apps/scheme-handler.png

          cp packaging/linux/scheme-handler.desktop AppDir/scheme-handler.desktop

      - name: Download linuxdeploy x86_64
        run: |
          curl -L --fail --retry 3 \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

          APPIMAGE=$(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy-*' | head -1)
          test -n "$APPIMAGE"
          mv "$APPIMAGE" "scheme-handler-${VERSION}-linux-x86_64.AppImage"
          chmod +x "scheme-handler-${VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            scheme-handler_${{ needs.prepare.outputs.version }}_amd64.deb
            scheme-handler-${{ needs.prepare.outputs.version }}-linux-x86_64.AppImage

  # ------------------------------------------------------------
  # Linux ARM64: AppImage on native ARM64 runner
  # ------------------------------------------------------------
  build-linux-arm64:
    name: Build Linux ARM64 AppImage
    needs: prepare
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare AppDir
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp target/aarch64-unknown-linux-gnu/release/scheme-handler \
             AppDir/usr/bin/scheme-handler
          chmod +x AppDir/usr/bin/scheme-handler

          cp packaging/linux/scheme-handler.desktop \
             AppDir/usr/share/applications/scheme-handler.desktop

          cp packaging/icon.png \
             AppDir/usr/share/icons/hicolor/512x512/apps/scheme-handler.png

          cp packaging/linux/scheme-handler.desktop AppDir/scheme-handler.desktop

      - name: Download linuxdeploy ARM64
        run: |
          curl -L --fail --retry 3 \
            -o linuxdeploy-aarch64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          chmod +x linuxdeploy-aarch64.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./linuxdeploy-aarch64.AppImage --appdir AppDir --output appimage

          APPIMAGE=$(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy-*' | head -1)
          test -n "$APPIMAGE"
          mv "$APPIMAGE" "scheme-handler-${VERSION}-linux-arm64.AppImage"
          chmod +x "scheme-handler-${VERSION}-linux-arm64.AppImage"

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            scheme-handler-${{ needs.prepare.outputs.version }}-linux-arm64.AppImage

  # ------------------------------------------------------------
  # macOS Intel: unsigned DMG
  # ------------------------------------------------------------
  build-macos-x86:
    name: Build macOS Intel DMG
    needs: prepare
    runs-on: macos-15-intel

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build app
        env:
          TARGET: x86_64-apple-darwin
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash ./packaging/macos/build-app.sh

      - name: Create DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "scheme-handler.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "scheme-handler" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "scheme-handler-${VERSION}-macos-x86_64.dmg"

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            scheme-handler-${{ needs.prepare.outputs.version }}-macos-x86_64.dmg

  # ------------------------------------------------------------
  # macOS Apple Silicon: unsigned DMG
  # ------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS ARM64 DMG
    needs: prepare
    runs-on: macos-14

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build app
        env:
          TARGET: aarch64-apple-darwin
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash ./packaging/macos/build-app.sh

      - name: Create DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "scheme-handler.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "scheme-handler" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "scheme-handler-${VERSION}-macos-arm64.dmg"

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            scheme-handler-${{ needs.prepare.outputs.version }}-macos-arm64.dmg

  # ------------------------------------------------------------
  # GitHub Release
  # ------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs:
      - prepare
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos-x86
      - build-macos-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -maxdepth 2 -print

      - name: Generate release notes from tag range
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | awk -v current="$TAG" '$0 != current {print; exit}')

          {
            echo "## Changes in $TAG"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --no-merges --invert-grep --grep='^chore(release):' \
                --pretty=format:'- %s (`%h`)' "$PREVIOUS_TAG..$TAG"
            else
              git log --no-merges --invert-grep --grep='^chore(release):' \
                --pretty=format:'- %s (`%h`)' "$TAG"
            fi
            echo
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            release-assets/* \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
